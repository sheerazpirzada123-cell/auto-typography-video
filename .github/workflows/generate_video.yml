name: Daily Typography Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Python Libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        pip install -r requirements.txt

    - name: Fix ImageMagick Security Policy
      run: |
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@\*"/' /etc/ImageMagick-6/policy.xml || true

    - name: Generate Script & Audio
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      run: python script_generator.py

    - name: Render Video
      run: python video_builder.py

    - name: Upload Video Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-video
        path: final_output.mp4
        
